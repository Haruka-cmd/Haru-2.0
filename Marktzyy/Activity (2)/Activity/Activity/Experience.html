<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experience</title>
    <style>
        body {
            background-color: #003B46;
            color: #fff;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            cursor: url("../img/panda.png") 11 11, pointer;
            padding: 20px;
        }

        section {
            background-color: #E0FFFF;
            text-align: left;
            border-radius: 30px;
            margin: 40px auto;
            padding: 30px;
            color: black;
            box-shadow: 0 0 15px #00CED1;
            width: 90%;
            max-width: 900px;
        }

        h1 {
            color: #578127;
        }

        hr {
            border: 2px solid #801280;
            margin: 30px 0;
        }

        li {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.2em;
            list-style-type: disc;
            color: black;
        }

        sup {
            font-weight: normal;
            font-size: 0.9em;
            color: #555;
            margin-left: 8px;
        }

        footer {
            text-align: center;
            margin: 40px 0;
        }

        footer a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            padding: 10px 15px;
            background-color: #FFE156;
            border-radius: 10px;
            margin: 5px;
            display: inline-block;
            border: 2px solid black;
            transition: background-color 0.3s;
        }

        footer a:hover {
            background-color: #FFB830;
            color: white;
        }
    </style>
</head>
<body>
    <section>
        <h1>EXPERIENCE</h1>
        <hr />
        <ul>
            <li>Sari-sari Store Vendor <sup>Family Business</sup></li>
            <li>Hardware <sup>Family Business</sup></li>
        </ul>
    </section>
</body>
<footer>
    <a href="Resume.html">Back</a>
</footer>
</html>
