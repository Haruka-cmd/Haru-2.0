<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Mark's Portfolio</title>
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <div class="corner-light light1"></div>
  <div class="corner-light light2"></div>

  <header>
    <img src="img/ningg.png" alt="NingNing" class="profile-spin">
    <nav>
      <a href="HOMEE.html">HOME</a>
      <a href="ABOUTT.html">ABOUT ME</a>
      <a href="ACTIVITIESS.html">ACTIVITIES</a>
      <a href="CONTACTT.html" class="active">CONTACT</a>
    </nav>
    <img src="img/ningg.png" alt="NingNing" class="profile-spin">
  </header>

  <main>
    <section class="contact-area">
      <iframe src="https://www.aespa.com/"></iframe>
      <div class="form-container">
        <form onsubmit="return validateForm()">
          <label>Name:</label>
          <input type="text" id="name" required>
          <label>Email:</label>
          <input type="email" id="email" required>
          <label>Message:</label>
          <textarea id="msg" required></textarea>
          <button type="submit">SUBMIT</button>
        </form>
      </div>
      <iframe src="https://www.aespa.com/"></iframe>
    </section>
  </main>

  <footer>
    <div class="emblems">
      <img src="img/karina_emblem.png" alt="">
      <img src="img/winter_emblem.png" alt="">
      <img src="img/aesspa.png" alt="" class="aespa-logo">
      <img src="img/giselle_emblem.png" alt="">
      <img src="img/ningning_emblem.png" alt="">
    </div>
  </footer>

<script>
function validateForm(){
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const msg=document.getElementById("msg").value.trim();
  if(!name||!email||!msg){alert("Please fill out all fields!");return false;}
  alert("Message sent successfully!");
  return false;
}
</script>
</body>
</html>
