    <style>
        body {
            background-color: #003B46;
            font-family: 'Times New Roman', Times, serif;
            color: #fff;
            margin: 0;
            padding-top: 80px;
        }

        .nav-activities {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgb(158, 163, 163);
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 0;
            border-style: double;
            z-index: 1000;
        }

        .nav-activities a {
            text-decoration: none;
            color: black;
            background-color: #FFE156;
            padding: 10px 15px;
            border: 2px solid black;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .nav-activities a:hover {
            background-color: #FFB830;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 300%;
            margin-bottom: 40px;
        }

        .gallery-section, .all-members-title, .member-title {
            background-color: #E0FFFF;
            color: black;
            border-radius: 20px;
            margin: 20px;
            padding: 20px;
            box-shadow: 0 0 15px #00CED1;
        }

        .all-members-title, .member-title {
            font-size: 220%;
            text-align: center;
            text-decoration: underline;
        }

        .gallery-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        figure {
            text-align: center;
            color: black;
            cursor: pointer;
            background-color: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.4);
        }

        figure img {
            width: 200px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
            display: block;
        }

        figure img:hover {
            transform: scale(1.05);
        }

        figcaption {
            margin-top: 8px;
            font-size: 120%;
            font-weight: bold;
        }

        hr {
            border: 2px solid #801280;
            margin: 40px auto;
            width: 60%;
        }

        .video-container,
        .audio-container,
        .map-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            text-align: center;
        }

        .audio-container figure {
            margin: 0 10px;
        }

        .audio-container figcap {
            display: block;
            margin-top: 5px;
            color: white;
        }

        .map-container iframe {
            border-radius: 10px;
            box-shadow: 0 0 15px #00CED1;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.5);
        }

        p a {
            color: #FFE156;
            text-decoration: none;
            font-weight: bold;
        }

        p a:hover {
            color: #FFB830;
        }
    </style>
</head>

    <div class="lightbox" id="lightbox">

    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");

        document.querySelectorAll("figure img").forEach(img => {
            img.addEventListener("click", () => {
                lightbox.style.display = "flex";
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
            });
        });

        lightbox.addEventListener("click", () => {
            lightbox.style.display = "none";
        });
    </script>
