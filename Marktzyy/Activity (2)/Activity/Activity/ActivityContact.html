<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #bbbbec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding-top: 100px;
    }

    
    .nav-activities {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgb(158, 163, 163);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 0;
      border-style: double;
      z-index: 999;
    }

    .nav-activities a {
      text-decoration: none;
      color: black;
      background-color: #FFE156;
      padding: 10px 15px;
      border: 2px solid black;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .nav-activities a:hover {
      background-color: #FFB830;
      color: white;
    }

    form {
      background: #eca0a0;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 350px;
    }

    h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 90%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: Arial, sans-serif;
    }

    #name,
    #number {
      text-align: center;
    }

    input[type="radio"] {
      margin-left: 10px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border: none;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  
  <div class="nav-activities">
    <a href="Lesson.html">Lesson</a>
    <a href="Resume.html">Resume</a>
    <a href="RecordSystem.html">System</a>
    <a href="Home.html">Home</a>
    <a href="Gallery.html">Gallery</a>
    <a href="Schedule.html">Schedule</a>
    <a href="new.html">Example</a>
    <a href="login&registration.html">Login</a>
    <a href="CalClock.html">CalClock</a>
  </div>

  
  <form onsubmit="registration(event)">
    <h3>Contact Information</h3>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="number">Number</label>
    <input type="number" id="number" placeholder="Enter your number" required>

    <p><strong>Gender</strong></p>
    <input type="radio" name="gender" value="Male" checked> Male
    <input type="radio" name="gender" value="Female"> Female

    <p><strong>Nationality</strong></p>
    <select id="nationality" required>
      <option value="">--Select Nationality--</option>
      <option value="Filipino">Filipino</option>
      <option value="American">American</option>
      <option value="Japanese">Japanese</option>
      <option value="Korean">Korean</option>
      <option value="Spanish">Spanish</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" rows="4" placeholder="Enter your message" required></textarea>
    
    <li><a href="Gallery.html">Gallery</a></li>

    <button type="submit">Submit</button>
  </form>

  
  <script>
    function registration(event) {
      event.preventDefault();

      let name = document.getElementById("name").value;
      let number = document.getElementById("number").value;
      let gender = document.querySelector('input[name="gender"]:checked').value;
      let nationality = document.getElementById("nationality").value;
      let message = document.getElementById("message").value;

      alert(
        "Registration Successful!\n\n" +
        "Name: " + name + "\n" +
        "Number: " + number + "\n" +
        "Gender: " + gender + "\n" +
        "Nationality: " + nationality + "\n" +
        "Message: " + message
      );
    }
  </script>
</body>
</html>
